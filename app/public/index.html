    out+='<div class="panel p-chips"><h2>Chips in der Mitte</h2><div class="row">'+(free||'<span class="note">alle vergeben</span>')+'</div>'+
      '<p class="note" style="margin-top:8px">1 = schlechteste Karten, '+n+' = beste. Chip antippen zum Nehmen (auch von den Bots), eigenen Chip antippen legt ihn zurück.</p>'+
      '<div class="hr"></div><div class="bar"><button class="'+(sp.ready.me?'':'primary')+'" data-a="ready"'+(sp.chips.me?'':' disabled')+'>'+
      (sp.ready.me?'Bereit zurücknehmen':'👊 Bereit')+'</button>'+
      (waiting.length?'<span class="note">Warten auf: '+esc(waiting.join(', '))+'</span>':'<span class="note">Alle bereit</span>')+'</div></div>';
  }
  if(ph==='guess'){
    var t=sp.target;
    if(t==='me')out+='<div class="panel p-guess"><h2>Tipp</h2><p>Du hast den höchsten Chip – die Bots tippen jetzt deine '+sp.K+' Karten …</p></div>';
    else{
      var pick='';
      for(var q=0;q<sp.K;q++){
        var v=sp.guess[q],o='<option value="">Karte</option>';
        RANK_NAME.forEach(function(x,kk){o+='<option value="'+kk+'"'+(v===kk?' selected':'')+'>'+x+'</option>';});
        pick+='<div class="row" style="gap:6px">'+rankHtml(v,'sm')+'<select data-g="r'+q+'">'+o+'</select></div>';
      }
      out+='<div class="panel p-guess"><h2>Tipp</h2><p>Welche '+sp.K+' Karten hat <b>'+esc(spPl(t).name)+'</b> (höchster Chip)? Nur der Wert zählt.</p>'+
        '<div class="row" style="gap:14px">'+pick+'</div><div class="hr"></div><div class="bar">'+
        '<button class="primary" data-a="confirm"'+(sp.guess.every(function(x){return x!=null;})?'':' disabled')+'>Tipp bestätigen</button></div></div>';
    }
  }
  if(ph==='done'){
    var res=sp.res,gr=sp.gr,rp='';
    rp+='<div class="panel p-reveal"><h2>Auflösung</h2>'+resultBox(res,gr);
    if(gr)rp+='<p style="margin-top:10px">Tipp auf '+esc(gr.target==='me'?'dich':spPl(gr.target).name)+': <b>'+gr.hits+' von '+gr.of+' Karten richtig</b>'+(gr.hits===gr.of?' ✓':'')+'</p>'+
      '<div class="row"><span class="note">getippt</span><div class="cards">'+gr.cards.map(function(r,i){return rankHtml(r,'sm '+(gr.marks[i]?'hit':'miss'));}).join('')+'</div>'+
      '<span class="note">tatsächlich</span><div class="cards">'+cardsHtml(gr.real,'sm')+'</div></div>';
    rp+='<div class="hr"></div><div class="bar"><button class="primary" data-a="spnext">Neue Hand</button></div>'+statsLine(sp.stats)+'</div>';
    out=out.slice(0,afterBoard)+rp+(coach?coach.l:'')+out.slice(afterBoard);
    out+=endBar(res,'spnext','');
  }
  return head+'<div class="cols'+(ph==='done'?' is-done':'')+'"><div class="col-l">'+out+'</div><div class="col-r">'+(coach?coach.r:'')+Rt+'</div></div>';
}

/* ---------- Voice-Chat (WebRTC direkt zwischen den Geräten, ohne TURN; im Admin schaltbar, Standard aus) ---------- */
var voice={on:false,stream:null,muted:false,peers:{},list:[],enabled:false,talk:{},timer:null,busy:false};
var ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
function voiceAvailable(){
  return !!(voice.enabled&&code&&joined&&!watching&&typeof RTCPeerConnection!=='undefined'&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
}
function voiceBox(){
  var b=$('voiceaudio');
  if(!b&&document.createElement&&document.body){b=document.createElement('div');b.id='voiceaudio';b.style.display='none';document.body.appendChild(b);}
  return b;
}
/* Einwilligung vor dem ersten Voice-Chat: einmal zustimmen, wird auf dem Gerät gespeichert, über ⓘ widerrufbar */
var VOICE_CONSENT='kr.voice.consent',voiceDlg=null;   // null | 'ask' (vor dem Beitreten) | 'info' (ⓘ)
function voiceConsented(){try{return !!localStorage.getItem(VOICE_CONSENT);}catch(e){return false;}}
function voiceConsent(){try{localStorage.setItem(VOICE_CONSENT,JSON.stringify({v:1,ts:Date.now()}));}catch(e){}voiceDlg=null;voiceJoin();}
function voiceRevoke(){try{localStorage.removeItem(VOICE_CONSENT);}catch(e){}voiceDlg=null;voiceLeave();render();showToast('Zustimmung zum Voice-Chat zurückgenommen');}
function voiceDialog(){
  if(!voiceDlg)return '';
  var ask=voiceDlg==='ask';
  return '<div class="cd-overlay vdlg" role="dialog" aria-modal="true" aria-labelledby="vdlgh"><div class="cd-box vbox">'+
    '<h2 id="vdlgh">🎙 Voice-Chat'+(ask?' – bevor es losgeht':'')+'</h2><ul>'+
    '<li>Dein <b>Mikrofon</b> wird erst genutzt, wenn du zustimmst und es im Browser freigibst. Stummschalten oder Verlassen geht jederzeit.</li>'+
    '<li>Der Ton läuft <b>direkt und verschlüsselt</b> zwischen den Geräten der Mitspieler – nicht über unseren Server – und wird <b>nicht aufgezeichnet</b>.</li>'+
    '<li>Für den Verbindungsaufbau sehen deine Mitspieler deine <b>IP-Adresse</b>. Dein Browser fragt dazu STUN-Server von <b>Google und Cloudflare</b> an, die dabei ebenfalls deine IP-Adresse erhalten.</li>'+
    '<li>Mehr dazu in der <a href="impressum.html#datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a>.</li></ul>'+
    (ask?'<div class="bar"><button class="primary" data-a="vconsent">Zustimmen &amp; beitreten</button><button class="ghost" data-a="vcancel">Abbrechen</button></div>'+
        '<p class="note">Deine Zustimmung wird auf diesem Gerät gespeichert, du wirst nicht erneut gefragt. Zurücknehmen kannst du sie über ⓘ neben dem Voice-Knopf.</p>'
      :'<p class="note">Du hast am '+esc(consentDate())+' zugestimmt.</p><div class="bar"><button class="ghost danger" data-a="vrevoke">Zustimmung zurücknehmen</button><button class="primary" data-a="vcancel">Schließen</button></div>')+
    '</div></div>';
}
function consentDate(){try{var c=JSON.parse(localStorage.getItem(VOICE_CONSENT));return new Date(c.ts).toLocaleDateString('de-DE');}catch(e){return '–';}}
function voiceJoin(){
  if(!voiceAvailable()||voice.on)return;
  if(!voiceConsented()){voiceDlg='ask';render();return;}
  unlockAudio();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}).then(function(st){
    voice.stream=st;voice.on=true;voice.muted=false;
    return api('voice',{room:code},{uid:uid,on:true,muted:false});
  }).then(function(r){
    if(r&&r.voice)voice.list=r.voice;
    if(!voice.timer)voice.timer=setInterval(voiceTick,1000);
    voiceTick();render();
  }).catch(function(e){
    voiceStop();
    uiErr=(e&&e.name==='NotAllowedError')?'Mikrofon nicht erlaubt – bitte in den Browser-Einstellungen freigeben.':'Voice-Chat nicht möglich: '+((e&&e.message)||e);
    render();
  });
}
function voiceStop(){
  if(voice.timer)clearInterval(voice.timer);voice.timer=null;
  for(var id in voice.peers)closePeer(id);
  if(voice.stream)voice.stream.getTracks().forEach(function(t){t.stop();});
  voice.stream=null;voice.on=false;voice.talk={};voice.busy=false;voice.s0=voice.sd0=null;
}
function voiceLeave(){
  if(!voice.on)return;
  var c=code;voiceStop();
  if(c)api('voice',{room:c},{uid:uid,on:false}).catch(function(){});
  render();
}
function voiceMute(){
  if(!voice.on)return;
  voice.muted=!voice.muted;
  voice.stream.getAudioTracks().forEach(function(t){t.enabled=!voice.muted;});
  api('voice',{room:code},{uid:uid,on:true,muted:voice.muted}).catch(function(){});
  render();
}
function closePeer(id){
  var p=voice.peers[id];if(!p)return;
  try{p.pc.close();}catch(e){}
  if(p.audio){try{p.audio.srcObject=null;p.audio.remove();}catch(e){}}
  delete voice.peers[id];delete voice.talk[id];
}
function newPeer(id){
  var pc=new RTCPeerConnection({iceServers:ICE_SERVERS}),p={pc:pc,audio:null,at:Date.now()};
  voice.stream.getTracks().forEach(function(t){pc.addTrack(t,voice.stream);});
  pc.ontrack=function(ev){
    if(!p.audio){var a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');voiceBox().appendChild(a);p.audio=a;}
    p.audio.srcObject=ev.streams[0];
    try{var pr=p.audio.play();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  };
  pc.onconnectionstatechange=function(){if(pc.connectionState==='failed'||pc.connectionState==='closed')closePeer(id);render();};
  voice.peers[id]=p;return p;
}
/* Kandidaten erst sammeln, dann das komplette Angebot schicken (ein Hin und Zurück über den Server) */
function gathered(pc){
  return new Promise(function(res){
    if(pc.iceGatheringState==='complete')return res();
    var t=setTimeout(res,2500);
    pc.addEventListener('icegatheringstatechange',function(){if(pc.iceGatheringState==='complete'){clearTimeout(t);res();}});
  });
}
function sendSig(to,type,data){return api('signal',{room:code},{uid:uid,to:to,type:type,data:data});}
function callPeer(id){
  var pc=newPeer(id).pc;
  pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){return gathered(pc);})
    .then(function(){return sendSig(id,'offer',JSON.stringify(pc.localDescription));})
    .catch(function(e){console.warn('voice offer',e&&e.message);closePeer(id);});
}
function onSignal(m){
  if(!m||!m.from)return;
  if(m.type==='bye'){closePeer(m.from);render();return;}
  var desc;try{desc=JSON.parse(m.data);}catch(e){return;}
  if(m.type==='offer'){
    closePeer(m.from);
    var pc=newPeer(m.from).pc;
    pc.setRemoteDescription(desc).then(function(){return pc.createAnswer();}).then(function(a){return pc.setLocalDescription(a);})
      .then(function(){return gathered(pc);}).then(function(){return sendSig(m.from,'answer',JSON.stringify(pc.localDescription));})
      .catch(function(e){console.warn('voice answer',e&&e.message);closePeer(m.from);});
  }else if(m.type==='answer'){
    var q=voice.peers[m.from];
    if(q&&q.pc.signalingState==='have-local-offer')q.pc.setRemoteDescription(desc).catch(function(e){console.warn('voice',e&&e.message);});
  }
}
function voiceTick(){
  if(!voice.on)return;
  if(!voiceAvailable()){voiceLeave();return;}
  if(voice.busy)return;voice.busy=true;
  api('signals',{room:code},{uid:uid,muted:voice.muted}).then(function(r){
    voice.busy=false;
    if(!voice.on)return;                    // inzwischen verlassen: späte Antwort nicht mehr verarbeiten
    voice.list=r.voice||[];
    (r.msgs||[]).forEach(onSignal);
    var ids=voice.list.map(function(v){return v.id;});
    for(var id in voice.peers)if(ids.indexOf(id)<0)closePeer(id);
    ids.forEach(function(id){if(id!==uid&&!voice.peers[id]&&uid<id)callPeer(id);});   // der mit der kleineren ID ruft an
    for(var id2 in voice.peers){var p=voice.peers[id2];
      if(p.pc.connectionState!=='connected'&&Date.now()-p.at>15000&&uid<id2)closePeer(id2);}   // hängt → neu anrufen
  }).catch(function(e){
    voice.busy=false;
    if(e&&/ausgeschaltet|Nur Spieler/.test(e.message)){voiceStop();render();}
  });
}
/* Wer spricht gerade? Tonenergie aus den WebRTC-Statistiken je Verbindung (eingehend = Gegenüber,
   media-source = eigenes Mikrofon). Funktioniert in Chrome, Safari und Firefox, ohne Web Audio. */
function isTalking(id){return !!voice.talk[id];}
setInterval(function(){
  if(!voice.on)return;
  var ids=Object.keys(voice.peers);
  if(!ids.length){if(Object.keys(voice.talk).length){voice.talk={};render();}return;}
  Promise.all(ids.map(function(id){
    return voice.peers[id].pc.getStats().then(function(st){
      var inb=null,src=null;
      st.forEach(function(x){if(x.kind==='audio'&&x.type==='inbound-rtp')inb=x;if(x.kind==='audio'&&x.type==='media-source')src=x;});
      return {id:id,inb:inb,src:src};
    }).catch(function(){return null;});
  })).then(function(res){
    var now={},loud=function(e,d,e0,d0){return e0!=null&&d>d0&&(e-e0)/(d-d0)>0.0004;};
    res.forEach(function(r){
      var p=r&&voice.peers[r.id];if(!p)return;
      if(r.inb&&r.inb.totalAudioEnergy!=null){var e=r.inb.totalAudioEnergy,d=r.inb.totalSamplesDuration||0;if(loud(e,d,p.e0,p.d0))now[r.id]=true;p.e0=e;p.d0=d;}
      if(r.src&&r.src.totalAudioEnergy!=null&&!('src' in now)){var e2=r.src.totalAudioEnergy,d2=r.src.totalSamplesDuration||0;
        if(!voice.muted&&loud(e2,d2,voice.s0,voice.sd0))now[uid]=true;voice.s0=e2;voice.sd0=d2;now.src=0;}
    });
    delete now.src;
    if(JSON.stringify(now)!==JSON.stringify(voice.talk)){voice.talk=now;render();}
  });
},500);
function voiceConnected(){var n=0;for(var id in voice.peers)if(voice.peers[id].pc.connectionState==='connected')n++;return n;}
function voiceMember(id){return (voice.list||[]).filter(function(v){return v.id===id;})[0]||null;}
function voiceBtns(){
  if(!voice.enabled||!code||watching||!joined)return '';
  var info=voiceConsented()?'<button class="small ghost" data-a="vinfo" title="Voice-Chat: Datenschutz und Zustimmung" aria-label="Voice-Chat Info">ⓘ</button>':'';
  if(!voice.on)return '<button class="small ghost" data-a="vjoin" title="Voice-Chat beitreten">🎙 Voice</button>'+info;
  var others=(voice.list||[]).filter(function(v){return v.id!==uid;}).length;
  return '<button class="small '+(voice.muted?'ghost':'primary')+'" data-a="vmute" title="Mikrofon an/aus">'+(voice.muted?'🔇 Stumm':'🎤 An')+'</button>'+
    '<span class="vstat note" data-n="'+voiceConnected()+'">'+voiceConnected()+'/'+others+' verbunden</span>'+
    '<button class="small ghost" data-a="vleave">Voice aus</button>'+info;
}
function voiceTag(id){
  var v=voiceMember(id);if(!v||!voice.enabled)return '';
  var talk=voice.on&&isTalking(id);
  return ' <span class="tag vc'+(talk?' talk':'')+'" title="im Voice-Chat">'+(v.muted?'🔇':talk?'🔊':'🎙')+'</span>';
}

/* ---------- Schnelle Reaktionen: 5 feste Emojis, erscheinen ein paar Sekunden neben dem Namen ---------- */
var REACTS=['👍','😂','😬','🤔','🔥'];   // 👍 😂 😬 🤔 🔥
var REACT_MS=4500,reactShown='';
function reactOf(id){
  var r=sp?(sp.react||{})[id]:(S.react||{})[id];
  if(!r||num(r.e)==null||!REACTS[num(r.e)])return null;
  var at=sp?r.ts:r.ts-(srvOff||0);          // Zeitstempel im Raum stammen vom Server
  return Date.now()-at<REACT_MS?REACTS[num(r.e)]:null;
}
function reactHtml(id){var e=reactOf(id);return e?'<span class="react-pop" title="Reaktion">'+e+'</span>':'';}
function reactBar(){
  if(!sp&&(watching||!joined||!code))return '';
  return '<div class="reactbar" role="group" aria-label="Schnelle Reaktion">'+REACTS.map(function(e,i){
    return '<button class="small ghost react-btn" data-react="'+i+'" aria-label="Reaktion '+e+'">'+e+'</button>';}).join('')+'</div>';
}
function sendReact(i){
  i=num(i);if(i==null||i<0||i>4)return;
  if(sp){sp.react=sp.react||{};sp.react.me={e:i,ts:Date.now()};render();return;}
  if(!code||watching)return;
  docs['react/'+uid]={e:i,ts:Date.now()+(srvOff||0)};applyDocs();
  api('react',{room:code},{uid:uid,e:i}).catch(function(e){if(!/schnell/.test(e.message))showErr(e);});
}
setInterval(function(){                     // abgelaufene Reaktionen ausblenden
  if(!code&&!sp)return;
  var ids=sp?sp.players.map(function(p){return p.id;}):S.players.map(function(p){return p.id;});
  var k=ids.map(function(id){return reactOf(id)||'';}).join('|');
  if(k!==reactShown){reactShown=k;render();}
},700);

/* ---------- Offline: Service Worker hält die App vor; Übungsraum läuft ohne Netz ---------- */
var netDown=false,spPending=0;
try{spPending=Math.max(0,parseInt(localStorage.getItem('kr.sp.pending'),10)||0);}catch(e){}
function isOffline(){return netDown||(typeof navigator.onLine==='boolean'&&!navigator.onLine);}
function reportSpHand0(){spPending--;reportSpHand();}   // nachreichen, ohne eine Hand dazuzuzählen
function reportSpHand(){
  spPending++;try{localStorage.setItem('kr.sp.pending',String(spPending));}catch(e){}
  try{api('sphand',{},{n:Math.min(20,spPending)}).then(function(){spPending=0;try{localStorage.setItem('kr.sp.pending','0');}catch(e){}}).catch(function(){});}catch(e){}
}
function offlineBanner(){
  if(!isOffline())return '';
  return '<div class="panel offline"><p class="info">📴 <b>Offline</b> – Räume gehen gerade nicht, der Übungsraum schon.</p>'+
    '<div class="bar"><button class="primary" data-a="sp">🤖 Übungsraum spielen</button></div></div>';
}

/* ---------- Lernmodus im Übungsraum: erklärt, was die eigene Hand wert ist und warum etwas anders gehört ---------- */
var spLearn=false;try{spLearn=localStorage.getItem('kr.sp.learn')==='1';}catch(e){}
function spToggleLearn(){spLearn=!spLearn;try{localStorage.setItem('kr.sp.learn',spLearn?'1':'0');}catch(e){}render();}
function spLearnBtn(){return '<button class="small '+(spLearn?'primary':'ghost')+'" data-a="splearn" title="Lernmodus: Tipps und Erklärungen">🎓 Lernmodus'+(spLearn?' an':'')+'</button>';}
/* Einschätzung der eigenen Hand je Runde (gleiches Verfahren wie die Bots, einmal pro Runde gerechnet) */
function spCoachEst(){
  var k=sp.hand+'.'+sp.stage;sp.coach=sp.coach||{};
  if(sp.coach[k]==null)sp.coach[k]=spEstimate('me',300);
  var n=sp.players.length,raw=sp.coach[k],e=(n+1)/2+(raw-(n+1)/2)*1.7;
  return {raw:raw,e:e,sug:Math.max(1,Math.min(n,Math.round(e))),n:n};
}
function whyStronger(a,b){        // a ist stärker als b: kurze Begründung
  if(a.cat!==b.cat)return HAND_NAMES[a.cat]+' schlägt '+HAND_NAMES[b.cat];
  return 'beide '+HAND_NAMES[a.cat]+' – die höheren Werte entscheiden';
}
function coachPlay(){
  var c=spCoachEst(),st=sp.stage,mine=sp.hole.me,vis=spVisible(st),my=bestHand(mine.concat(vis),mine),cur=sp.chips.me||null,out='';
  var pct=Math.round((c.raw-1)/(c.n-1)*100);
  out+='<p>Du hast: <b>'+esc(handName(my))+'</b>.';
  var bd=vis.length?bestHand(vis):null;
  if(bd&&bd.cat>0&&my.cat===0)out+=' Das '+esc(HAND_NAMES[bd.cat])+' auf dem Tisch haben alle – nach eurer Hausregel zählt es für dich nicht, nur deine höchste Karte.';
  out+='</p>';
  out+='<div class="coachbar" title="Stärke im Vergleich zu zufälligen Händen"><span style="width:'+Math.max(4,Math.min(100,pct))+'%"></span></div>';
  out+='<p class="note">'+(st===1?'Noch keine Tischkarten – nur deine '+sp.K+' Karten zählen. Ein Paar auf der Hand oder hohe Karten (A, K) sind stark; kleine, ungleiche Karten eher schwach.':
    st===4?'Alle 5 Tischkarten liegen – jetzt steht deine Hand fest. Wichtig ist nur noch, wie sie gegen die anderen abschneidet.':
    'Es kommen noch '+(5-vis.length)+' Tischkarte'+(5-vis.length>1?'n':'')+'. Die Einschätzung rechnet mit, was noch kommen kann.')+'</p>';
  out+='<p>Deine Hand liegt vermutlich auf <b>Platz '+c.e.toFixed(1).replace('.',',')+' von '+c.n+'</b> → passender Chip: <b class="coachchip">'+c.sug+'</b></p>';
  var holder=spHolder(c.sug);
  if(!cur)out+='<p class="coachtip">👉 Nimm die <b>'+c.sug+'</b>'+(holder&&holder!=='me'?' – die hat gerade '+esc(spPl(holder).name)+'. Du darfst sie wegnehmen, wenn du dir sicher bist, oder auf die Nachbarzahl ausweichen.':'.')+'</p>';
  else if(cur===c.sug)out+='<p class="coachok">✓ Dein Chip '+cur+' passt zu deiner Hand.</p>';
  else if(Math.abs(cur-c.e)<0.8)out+='<p class="coachok">✓ Chip '+cur+' ist vertretbar – deine Hand liegt zwischen '+Math.floor(c.e)+' und '+Math.ceil(c.e)+'.</p>';
  else out+='<p class="coachwarn">⚠ Chip '+cur+' ist eher zu '+(cur>c.e?'hoch':'niedrig')+': '+(cur>c.e?'Viele andere Hände schlagen '+esc(handName(my))+'.':'Deine Hand schlägt vermutlich mehr Mitspieler, als die '+cur+' sagt.')+' Besser wäre die <b>'+c.sug+'</b>'+(holder&&holder!=='me'?' (hat '+esc(spPl(holder).name)+')':'')+'.</p>';
  out+='<p class="note">Die Chips der anderen sind ihre Einschätzung: Wer eine hohe Zahl festhält, hält seine Hand für stark. Holt sich ein Bot seinen Chip zurück, ist er sich sicher.</p>';
  return out;

function joinRoom(pre){

  myName=name.trim();

var statsOpen=false,recorded={};
/* Fertige Hand an den Server melden (jeder Spieler; der Server nimmt nur die erste Meldung je Hand) */
function maybeRecord(){
  if(!code||!joined||watching||phase()!=='done')return;
  var h=hand(),k=code+'.'+h;
  if(recorded[k]||(S.stats||[]).some(function(e){return num(e.hand)===h;}))return;
  var res=resolveHand();if(!res||res.missing)return;   // unvollständig aufgedeckt → zählt nicht
  recorded[k]=true;
  var gr=guessResult();
  api('record',{room:code},{uid:uid,hand:h,win:res.win,
    players:parts().map(function(id){var b=res.by[id]||{};return {id:id,ok:!!b.ok,
      rounds:roundHits(b.lo,b.hi,function(r){return num(((main().chipHist||{})[String(r)]||{})[id]);})};}),
    guess:gr?{target:gr.target,hits:gr.hits,of:gr.of}:null}).catch(function(){recorded[k]=false;});
}
/* Lag der Chip in Runde 1..4 schon im Bereich der endgültigen Stärke (lo..hi)? */
function roundHits(lo,hi,chipIn){
  var out=[];for(var r=1;r<=4;r++){var c=chipIn(r);out.push(c==null||lo==null?null:(c>=lo&&c<=hi));}
  return out;
}
function calcStats(list){
  var o={hands:0,wins:0,streak:0,best:0,hits:0,of:0,perfect:0,guesses:0,pl:{}},run=0;
  (list||[]).forEach(function(e){
    if(!e||!Array.isArray(e.players))return;
    o.hands++;
    if(e.win){o.wins++;run++;if(run>o.best)o.best=run;}else run=0;
    if(e.guess&&num(e.guess.of)){o.guesses++;o.hits+=num(e.guess.hits)||0;o.of+=num(e.guess.of);if(num(e.guess.hits)===num(e.guess.of))o.perfect++;}
    e.players.forEach(function(p){
      var id=String(p.id||'');if(!id)return;
      var x=o.pl[id]||(o.pl[id]={id:id,name:'',n:0,ok:0,tgt:0,tgtHit:0,r:[[0,0],[0,0],[0,0],[0,0]]});
      x.name=String(p.name||x.name||'Spieler');x.n++;if(p.ok)x.ok++;
      if(Array.isArray(p.rounds))for(var ri=0;ri<4;ri++){if(p.rounds[ri]===true||p.rounds[ri]===false){x.r[ri][1]++;if(p.rounds[ri])x.r[ri][0]++;}}
    });
    if(e.guess&&o.pl[e.guess.target]){o.pl[e.guess.target].tgt++;if(num(e.guess.hits)===num(e.guess.of))o.pl[e.guess.target].tgtHit++;}
  });
  o.streak=run;
  return o;
}
function pct(a,b){return b?Math.round(a*100/b)+' %':'\u2013';}
function statsLine(list){
  var st=calcStats(list||S.stats);if(!st.hands)return '';
  return '<p class="note statsline">📊 '+st.wins+' von '+st.hands+' Händen richtig ('+pct(st.wins,st.hands)+')'+
    (st.streak>1?' \u00b7 Serie: '+st.streak+' \u2713':'')+' \u00b7 <a href="#" data-a="stats">Statistik</a></p>';
}

  out+='<div class="stwrap"><table class="stbl"><thead><tr><th>Spieler</th><th>Hände</th><th>richtig platziert</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th>'+(st.guesses?'<th>getippt (komplett)</th>':'')+'</tr></thead><tbody>'+
    rows.map(function(x){
      return '<tr'+(x.id===uid?' class="me"':'')+'><td>'+esc(x.name)+'</td><td>'+num(x.n)+'</td><td>'+num(x.ok)+' ('+pct(x.ok,x.n)+')</td>'+
        x.r.map(function(q){return '<td class="rc">'+pct(q[0],q[1])+'</td>';}).join('')+
        (st.guesses?'<td>'+num(x.tgt)+(x.tgt?' ('+num(x.tgtHit)+')':'')+'</td>':'')+'</tr>';
    }).join('')+'</tbody></table></div>';
  var last=list.slice(-12).map(function(e){return '<span class="dot '+(e.win?'ok':'bad')+'" title="Hand '+num(e.hand)+'">'+(e.win?'\u2713':'\u2717')+'</span>';}).join('');
  out+='<p class="note" style="margin-top:8px">Letzte Hände: '+last+'</p>';
  return out+'</div>';

function roomView(){
  var h=hand(),ph=phase(),ps=parts(),m=pmap();
  var out='';
  out+='<div class="panel"><div class="spread">'+
    '<div><div class="brand sm" data-a="reload" role="button" tabindex="0" title="Seite neu laden"><img class="logo" src="logo.svg" alt="">Letzte Runde</div><h1>'+(roomName()?esc(roomName())+' ':'Raum ')+'<span class="code">'+esc(code)+'</span>'+
      (isHost()&&!watching?' <button class="small ghost rename" data-a="rename" title="Raum umbenennen">✎</button>':'')+'</h1>'+
    '<div class="note">'+esc(phaseLabel())+(S.room&&num(S.room.startsAt)>srvNow()?' \u00b7 öffnet '+esc(fmtWhen(num(S.room.startsAt)))+'':'')+(watching?' \u00b7 <span class="tag">Zuschauer</span>':'')+'</div></div>'+
    '<div class="row">'+voiceBtns()+fxBtn()+themeBtn()+'<button class="small ghost" data-a="invite">\ud83d\udd17 Einladen</button>'+
      '<button class="small ghost" data-a="stats" title="Statistik" aria-label="Statistik">📊</button>'+
      (isHost()&&!watching?'<button class="small ghost danger" data-a="close">Raum schließen</button>':'')+
      '<button class="small ghost" data-a="leave">Verlassen</button></div></div>'+
    (watching?'<div class="hr"></div><div class="row"><div class="field"><label class="lbl">Dein Name</label>'+
      '<input id="name" value="'+esc(myName)+'" maxlength="18" placeholder="Name"></div>'+
      '<button class="primary" data-a="play">Mitspielen</button></div>'+
      '<p class="note" style="margin-top:6px">Wer während einer Hand einsteigt, spielt ab der nächsten Hand mit. '+
      'Ist jemand länger als '+Math.round(TAKE_MS/1000)+' s offline, kannst du unten bei ihm \u201ePlatz übernehmen\u201c und sofort weiterspielen.</p>':'')+
    '</div>';

  if(inviteOpen)out+=invitePanel();
  if(statsOpen)out+=statsPanel();
  if(uiErr)out+='<div class="panel"><p class="err">'+esc(uiErr)+'</p></div>';
  if(uiNote)out+='<div class="panel info-panel"><p class="info">'+esc(uiNote)+'</p><button class="small ghost" data-a="noteok">OK</button></div>';
  if(cd.key)out+=countdownHtml();
  out+=voiceDialog()+botifyDialog();

  var L='',Rt='';
  var cols=function(){return out+'<div class="cols with-chat'+(ph==='done'?' is-done':'')+'"><div class="col-l">'+L+'</div><div class="col-r">'+Rt+'</div></div>';};
  if(ph==='lobby'){
    L+='<div class="panel p-players"><div class="spread"><h2>Spieler ('+S.players.length+')</h2>'+reactBar()+'</div>'+playerList(false)+
      '<div class="hr"></div><div class="bar">'+
      (isHost()?'<button class="primary" data-a="start"'+(S.players.length<(CFG.minPlayers||3)?' disabled':'')+'>Hand geben</button>'+addBotBtn():
        '<span class="note">Warten auf '+esc(pname(hostId()))+' \u2026</span>')+
      (S.players.length<(CFG.minPlayers||3)?'<span class="note">Mindestens '+(CFG.minPlayers||3)+' Spieler nötig.</span>':'')+
      '</div></div>';
    return cols();
  }
  if(ph==='deal'){
    L+='<div class="panel p-board"><p class="muted">Karten werden gegeben \u2026</p>'+
      '<p class="note">Mischen: '+esc(pname(roleId(0)))+' \u00b7 Verteilen: '+esc(pname(roleId(1)))+' + '+esc(pname(roleId(2)))+'</p>'+
      '<div class="hr"></div><div class="bar">'+
      ((S.aB&&S.aB.hand===h)?'<button class="small" data-a="force">Weiter</button>':'')+
      '<button class="small ghost" data-a="abort">Hand abbrechen</button></div></div>';
    return cols();
  }

  /* Board */
  var bc=boardCache[h]||[null,null,null,null,null];
  var shown=boardSlotsFor(stage());
  if(ph!=='play')shown=[0,1,2,3,4];
  var bh='';
  /* Zuletzt aufgedeckte Tischkarte(n) bleiben die ganze Runde markiert */
  var st=stage(),fresh=ph==='play'?(st===2?[0,1,2]:st===3?[3]:st===4?[4]:[]):ph==='guess'?[4]:[];
  for(var i=0;i<5;i++){
    if(shown.indexOf(i)>=0&&bc[i]!=null)bh+=cardHtml(bc[i],fresh.indexOf(i)>=0?'fresh':'');

    rankingHtml(my?my.cat:-1)+'</div>';

  /* Spieler + Chips */
  Rt+='<div class="panel p-players"><div class="spread"><h2>Spieler</h2>'+reactBar()+'</div>'+playerList(true)+'</div>';

  if(ph==='play'){
    var free='';
    for(var n=1;n<=ps.length;n++) if(!chipHolder(n)) free+='<div class="chip r'+stage()+'" data-chip="'+n+'">'+n+'</div>';
    L+='<div class="panel p-chips"><h2>Chips in der Mitte</h2><div class="row">'+(free||'<span class="note">alle vergeben</span>')+'</div>'+
      '<p class="note" style="margin-top:8px">1 = schlechteste Karten, '+ps.length+' = beste. Chip antippen zum Nehmen'+(optb('allowSteal')?' (auch von anderen)':'')+', eigenen Chip antippen legt ihn zurück.</p>'+
      '<div class="hr"></div><div class="bar">'+
      (ps.indexOf(uid)>=0?'<button class="'+(isReady(m[uid])?'':'primary')+'" data-a="ready"'+(chipOf(uid)?'':' disabled')+'>'+
        (isReady(m[uid])?'Bereit zurücknehmen':'\ud83d\udc4a Bereit')+'</button>':'')+
      waitingHtml(ps.filter(function(id){return !isReady(m[id]);}),'Alle bereit')+
      '<button class="small ghost" data-a="abort">Hand abbrechen</button>'+
      '</div></div>';
  }

  if(ph==='guess')L+='<div class="p-guess">'+guessPanel()+'</div>';
  if(ph==='reveal'||ph==='done')L=L.slice(0,afterBoard)+'<div class="p-reveal">'+revealPanel()+'</div>'+L.slice(afterBoard);
  if(ph==='done')L+=endBar(resolveHand(),isHost()?'start':null,isHost()?'':'Warten auf '+pname(hostId())+' \u2026');
  return cols();
}

/* 3-2-1 legt sich über alles; Zurücknehmen bleibt direkt im Overlay möglich */
function countdownHtml(){
  var btn='';
  if(phase()==='play'&&parts().indexOf(uid)>=0&&!watching)
    btn='<button class="primary" data-a="ready">Bereit zurücknehmen</button>';
  else if(phase()==='guess'&&canGuess())
    btn='<button class="primary" data-a="confirm">Tipp zurücknehmen</button>';
  return '<div class="cd-overlay" role="alertdialog" aria-live="assertive"><div class="cd-box">'+
    '<div class="cd-lbl">Gleich wird aufgedeckt</div>'+
    '<div class="cd-num">'+cdLeft()+'</div>'+btn+'</div></div>';
}
function fmtAway(ms){var s=Math.floor(ms/1000);return s<60?s+' s':Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)+' min';}
function themeBtn(){return '<button class="small ghost icon" data-a="theme" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten">\u25d0</button>';}
function phaseLabel(){
  var ph=phase();
  if(ph==='lobby')return 'Lobby \u00b7 Hand '+hand();
  if(ph==='deal')return 'Hand '+hand()+' \u00b7 geben';
  if(ph==='play')return 'Hand '+hand()+' \u00b7 Runde '+stage()+' von 4';
  if(ph==='guess')return 'Hand '+hand()+' \u00b7 gemeinsamer Tipp';
  if(ph==='reveal')return 'Hand '+hand()+' \u00b7 aufdecken';
  return 'Hand '+hand()+' \u00b7 fertig';
}
function playerList(inHand){
  var ps=inHand?parts().slice():S.players.map(function(p){return p.id;});
  var m=pmap(),ph=phase(),h=hand();
  if(inHand&&ph!=='deal'){
    var ord=parts();
    ps.sort(function(a,b){var ca=chipOf(a),cb=chipOf(b);
      return (cb==null?-1:cb)-(ca==null?-1:ca)||ord.indexOf(a)-ord.indexOf(b);});   // höchster Chip oben
  }
  var board=(ph==='reveal'||ph==='done')?visibleBoard():null;
  var res=inHand?resolveHand():null;
  var out='<div class="plist">';
  ps.forEach(function(id){
    var p=m[id]||{id:id,name:'(weg)'};
    var c=chipOf(id);
    var rv=revealedCards(id);
    var cards='';
    if(inHand&&(ph==='reveal'||ph==='done')&&rv)
      cards='<div class="cards">'+cardsHtml(rv,'sm')+'</div>'+
        '<span class="tag hand">'+esc(handName(bestHand(rv.concat(board||[]),rv)))+'</span>';
    else if(inHand&&id!==uid){var bb='';for(var z2=0;z2<HC();z2++)bb+=backHtml('sm');cards='<div class="cards">'+bb+'</div>';}
    else if(inHand&&id===uid&&myHand&&myHand.hand===h)cards='<div class="cards">'+cardsHtml(myHand.cards,'sm')+'</div>';
    var rx=res&&res.by[id],verdict='';
    if(rx&&rx.hand&&rx.chip!=null){
      verdict=rx.ok?'<span class="tag res ok">\u2713 richtig</span>':
        '<span class="tag res bad">\u2717 vertauscht mit '+esc(rx.swaps.map(pname).join(', '))+
        ' \u00b7 wäre Chip '+(rx.lo===rx.hi?rx.lo:rx.lo+'\u2013'+rx.hi)+'</span>';
    }else if(rx)verdict='<span class="tag res">nicht aufgedeckt</span>';
    out+='<div class="pl'+(id===uid?' me':'')+(rx&&rx.hand?(rx.ok?' res-ok':' res-bad'):'')+'">'+
      (inHand?(c?'<div class="chip r'+(ph==='play'?stage():4)+((ph==='play'&&(id===uid||optb('allowSteal')))?'':' static')+(id===uid?' mine':'')+'"'+
        ((ph==='play'&&(id===uid||optb('allowSteal')))?' data-chip="'+c+'"':'')+'>'+c+'</div>':'<div class="chip ph static">\u2013</div>'):'')+
      '<div class="nm">'+esc(p.name||'Spieler')+(id===uid?' <span class="tag you">du</span>':'')+(p.bot?' <span class="tag" title="Bot">\ud83e\udd16</span>':'')+voiceTag(id)+reactHtml(id)+
        (id===hostId()?' <span class="tag">Host</span>':'')+(inHand?histHtml(id):'')+'</div>'+
      (m[id]&&!isOnline(id)?'<span class="tag off">offline'+(away[id]!=null?' '+fmtAway(away[id]):'')+'</span>':'')+
      (inHand&&ph==='play'?(isReady(p)?'<span class="tag ok" title="bereit">\ud83d\udc4a</span>':'<span class="tag">\u2026</span>'):'')+
      (watching&&isBotP(id)&&(ph==='lobby'||ph==='done')?'<button class="small primary" data-replace="'+esc(id)+'">\u21aa Platz übernehmen</button>':'')+
      (watching&&m[id]&&idle.indexOf(id)>=0?'<button class="small primary" data-take="'+esc(id)+'">\u21aa Platz übernehmen</button>':
        (watching&&m[id]&&!isOnline(id)?'<span class="note">'+(id===hostId()?'Host \u2013 Rolle wandert nach '+Math.round(HOSTMOVE_MS/60000)+' min weiter':
          'übernehmbar in '+Math.max(1,Math.ceil((TAKE_MS-(away[id]||0))/1000))+' s')+'</span>':''))+
      (!watching&&isHost()&&id!==uid&&m[id]&&!isBotP(id)&&!isOnline(id)?'<button class="small ghost" data-botify="'+esc(id)+'" title="Offline-Spieler durch einen Bot ersetzen">\ud83e\udd16 ersetzen</button>':'')+
      (!watching&&isHost()&&id!==uid&&m[id]?'<button class="small ghost" data-kick="'+esc(id)+'" title="Aus dem Raum entfernen">\u2715</button>':'')+
      cards+verdict+
    '</div>';
  });
  return out+'</div>';
}

function guessPanel(){
  var g=S.guess||{cards:[null,null],confirmed:{}},t=main().target,gs=guessers();
  var conf=g.confirmed||{},n=0;gs.forEach(function(i){if(conf[i])n++;});
  var me=canGuess();
  var sel=function(i){
    var v=(g.cards&&g.cards[i]!=null)?g.cards[i]:null;
    var o='<option value="">Karte</option>';
    RANK_NAME.forEach(function(x,k){o+='<option value="'+k+'"'+(v===k?' selected':'')+'>'+x+'</option>';});
    return '<div class="row" style="gap:6px">'+rankHtml(v,'sm')+
      (me?'<select data-g="r'+i+'">'+o+'</select>':'')+'</div>';
  };
  var K=HC(),pick='';
  for(var z=0;z<K;z++)pick+=sel(z);
  return '<div class="panel"><h2>Gemeinsamer Tipp</h2>'+
    (uid===t?'<p>Du hast den höchsten Chip \u2013 die anderen tippen jetzt deine '+K+' Karten. Du tippst nicht mit.</p>':
      '<p>Welche '+K+' Karten hat <b>'+esc(pname(t))+'</b> (höchster Chip)? Nur der Wert zählt, die Farbe nicht.</p>')+
    '<div class="row" style="gap:14px">'+pick+'</div>'+
    '<div class="hr"></div><div class="bar">'+
    (me?'<button class="'+(conf[uid]?'':'primary')+'" data-a="confirm"'+(guessFilled()?'':' disabled')+'>'+
      (conf[uid]?'Tipp zurücknehmen':'Tipp bestätigen')+'</button>':'')+
    waitingHtml(gs.filter(function(id){return !conf[id];}),'Alle haben bestätigt')+
    '</div>'+
    (me?'<p class="note">Jede Änderung setzt die Bestätigungen zurück.</p>':'')+'</div>';
}

function revealPanel(){
  var ord=main().revealOrder||[],i=main().revealIdx||0,h=hand();
  var cur=ord[i]||null,g=S.guess||{},t=main().target;
  var out='<div class="panel"><h2>Aufdecken</h2>';
  if(phase()==='reveal'){
    out+='<p>Reihenfolge: '+(optb('revealHighestFirst')?'höchster Chip zuerst, danach ab Chip 1 aufwärts':'ab Chip 1 aufwärts')+'.</p>';
    if(cur===uid&&!(myHand&&myHand.hand===h))out+='<p class="info">Deine Karten dieser Hand liegen auf dem Gerät, von dem du übernommen hast.</p>'+
      '<div class="bar"><button class="primary" data-a="skip">Weiter (nicht aufdecken)</button></div>';
    else if(cur===uid)out+='<div class="bar"><button class="primary" data-a="reveal">Meine Karten aufdecken</button>'+
      '<span class="revcd"><span id="revleft">'+revLeft()+'</span> s</span><span class="note">danach automatisch</span></div>';
    else out+='<div class="bar"><span class="muted">Warten auf '+esc(pname(cur))+' \u2026</span>'+
      '<span class="revcd"><span id="revleft">'+revLeft()+'</span> s</span>'+nudgeBtn(cur)+
      '<button class="small ghost" data-a="skip">Überspringen</button></div>';
  }else{
    var res=resolveHand(),gr=guessResult();
    if(res){
      out+=resultBox(res,gr);
    }else out+='<p class="note">Auswertung läuft \u2026</p>';
    if(gr){
      out+='<p style="margin-top:10px">Tipp auf '+esc(pname(gr.target))+': <b>'+gr.hits+' von '+gr.of+' Karten richtig</b>'+
        (gr.hits===gr.of?' \u2713':'')+'</p>'+
        '<div class="row"><span class="note">getippt</span><div class="cards">'+
          gr.cards.map(function(r,i){return rankHtml(r,'sm '+(gr.marks[i]?'hit':'miss'));}).join('')+'</div>'+
        '<span class="note">tatsächlich</span><div class="cards">'+cardsHtml(gr.real,'sm')+'</div></div>';
    }
    out+='<div class="hr"></div><div class="bar">'+
      (isHost()?'<button class="primary" data-a="start">Neue Hand</button>'+addBotBtn():'<span class="note">Warten auf '+esc(pname(hostId()))+'\u2026</span>')+
      '</div>';
    out+=statsLine();
  }
  return out+'</div>';
}

/* ---------- Chat ---------- */
var chatShown=-1,chatMode=null,chatSeenTs=null;
function renderChat(){
  var box=$('chat');if(!box)return;
  var on=!!code,canWrite=!!(code&&!watching&&joined);
  box.style.display=on?'':'none';
  if(!on){chatShown=-1;chatMode=null;return;}
  var mode=canWrite?'rw':'ro';
  if(!$('chatmsgs')||chatMode!==mode){
    box.innerHTML='<div class="panel"><h2>Chat</h2><div id="chatmsgs" class="chatmsgs"></div>'+
      (canWrite?'<div class="row chatform"><input id="chatin" maxlength="300" placeholder="Nachricht \u2026" autocomplete="off">'+
        '<button class="primary" data-a="chat">Senden</button></div>':
        '<p class="note">Als Zuschauer liest du mit. Schreiben können nur Spieler.</p>')+'</div>';
    chatShown=-1;chatMode=mode;
  }
  var list=S.chat||[],last=list.length?list[list.length-1].ts+'|'+list.length:'0';
  if(last===chatShown)return;
  /* Ton nur für neue Nachrichten anderer, nicht beim ersten Laden des Verlaufs */
  var newest=list.length?list[list.length-1].ts:0;
  if(chatSeenTs!=null&&list.some(function(c){return c.ts>chatSeenTs&&c.id!==uid;}))fx('chat');
  chatSeenTs=Math.max(chatSeenTs||0,newest);
  chatShown=last;
  var mb=$('chatmsgs');if(!mb)return;
  mb.innerHTML=list.length?list.map(function(c){
    var d=new Date(c.ts),tm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return '<div class="msg'+(c.id===uid?' me':'')+'"><span class="who">'+esc(c.name)+'</span> '+esc(c.text)+
      ' <span class="tm">'+tm+'</span></div>';
  }).join(''):'<p class="note">Noch keine Nachrichten.</p>';
  mb.scrollTop=mb.scrollHeight;
}

/* Startseite: Restzeit geplanter Räume jede Sekunde; beim Erreichen der Startzeit neu zeichnen */
setInterval(function(){
  if(code||!document.querySelectorAll)return;
  var els=document.querySelectorAll('[data-left]'),now=srvNow(),again=false;
  for(var i=0;i<els.length;i++){var t=num(els[i].getAttribute('data-left'))||0;if(t<=now)again=true;else els[i].textContent=fmtLeft(t-now);}
  if(again)render();
},1000);
/* Countdown braucht regelmäßiges Neuzeichnen */
var cdShown=null;
setInterval(function(){
  if(!code||!cd.key){cdShown=null;return;}
  try{tick();}catch(e){console.error(e);}
  var k=cd.key?cd.key+'|'+cdLeft():null;
  if(k!==cdShown){cdShown=k;fx('tick');render();}
},250);

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  unlockAudio();
  var el=ev.target.closest?ev.target.closest('[data-a],[data-chip],[data-kick],[data-take],[data-replace],[data-nudge],[data-react],[data-botify]'):null;
  if(!el)return;
  var a=el.getAttribute('data-a');
  if(el.hasAttribute('data-chip')){takeChip(parseInt(el.getAttribute('data-chip'),10));return;}
  if(el.hasAttribute('data-kick')){kickPlayer(el.getAttribute('data-kick'));return;}
  if(el.hasAttribute('data-take')){takeOver(el.getAttribute('data-take'));return;}
  if(el.hasAttribute('data-replace')){replaceBot(el.getAttribute('data-replace'));return;}
  if(el.hasAttribute('data-react')){sendReact(el.getAttribute('data-react'));return;}
  if(el.hasAttribute('data-botify')){botifyStart(el.getAttribute('data-botify'));return;}
  if(el.hasAttribute('data-nudge')){nudge(el.getAttribute('data-nudge'));return;}
  uiErr='';
  if(watching&&['start','abort','ready','force','confirm','reveal','skip'].indexOf(a)>=0)return;
  if(a==='create')createRoom();
  else if(a==='join')joinRoom();
  else if(a==='joincode')joinRoom(el.getAttribute('data-code'));
  else if(a==='watch')watchRoom(el.getAttribute('data-code'));
  else if(a==='jump')jumpIn(el.getAttribute('data-code'),el.getAttribute('data-id'));
  else if(a==='play')playNow();
  else if(a==='theme')toggleTheme();
  else if(a==='noteok'){uiNote='';render();}
  else if(a==='invite'){inviteOpen=!inviteOpen;render();}
  else if(a==='copylink')copyLink(el.getAttribute('data-code'));
  else if(a==='sharelink')shareLink(el.getAttribute('data-code'));
  else if(a==='ics')icsDownload(el.getAttribute('data-code'));
  else if(a==='plan')planRoom();
  else if(a==='planopen'){planOpen=!planOpen;planShow=null;render();}
  else if(a==='planlink'){var pc=el.getAttribute('data-code');planShow=planShow===pc?null:pc;render();}
  else if(a==='planclose'){planShow=null;render();}
  else if(a==='fx')toggleFx();
  else if(a==='close')closeRoom();
  else if(a==='addbot')addBot();
  else if(a==='botnext'){if(botifyDlg){botifyDlg.step=2;render();}}
  else if(a==='botok')botifyConfirm();
  else if(a==='botcancel'){botifyDlg=null;render();}
  else if(a==='splearn')spToggleLearn();
  else if(a==='vjoin')voiceJoin();
  else if(a==='vmute')voiceMute();
  else if(a==='vleave')voiceLeave();
  else if(a==='vconsent')voiceConsent();
  else if(a==='vcancel'){voiceDlg=null;render();}
  else if(a==='vinfo'){voiceDlg='info';render();}
  else if(a==='vrevoke')voiceRevoke();
  else if(a==='reload'){try{location.reload();}catch(e){}}
  else if(a==='sp')spStart();
  else if(a==='spnext')spNewHand();
  else if(a==='spbots')spSetBots(el.getAttribute('data-n'));
  else if(a==='stats'){ev.preventDefault&&ev.preventDefault();statsOpen=!statsOpen;render();}
  else if(a==='rename')renameRoom();
  else if(a==='chat'){var ci=$('chatin');sendChat(ci&&ci.value);}
  else if(a==='leave')leave();
  else if(a==='start')startHand();
  else if(a==='abort')abortHand();
  else if(a==='ready')toggleReady();
  else if(a==='force')advance();
  else if(a==='confirm')confirmGuess();
  else if(a==='reveal')revealMine();
  else if(a==='skip')nextReveal().catch(showErr);
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter'||!ev.target)return;
  if(ev.target.id==='chatin'){ev.preventDefault();sendChat(ev.target.value);}
  else if(ev.target.id==='code'&&!code){ev.preventDefault();joinRoom();}
  else if(ev.target.getAttribute&&ev.target.getAttribute('data-a')==='reload'){ev.preventDefault();try{location.reload();}catch(e){}}
  else if(ev.target.id==='rname'&&!code){ev.preventDefault();createRoom();}
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(!el.hasAttribute||!el.hasAttribute('data-g'))return;
  var i=parseInt(el.getAttribute('data-g').slice(1),10);
  setGuessCard(i,el.value===''?null:parseInt(el.value,10));
});

/* ---------- Start ---------- */
try{var th=localStorage.getItem('kr.theme');if(th&&document.documentElement)document.documentElement.setAttribute('data-theme',th);}catch(e){}
/* Nach Reload/Verbindungsabbruch: derselbe Browser kommt automatisch auf seinen Platz zurück */
function rejoin(){
  var c=null;try{c=localStorage.getItem('kr.room');}catch(e){}
  if(!c||code)return;
  api('state',{room:c,since:-1}).then(function(r){
    var me=r.docs&&r.docs['players/'+uid];
    if(!me||code){try{localStorage.removeItem('kr.room');}catch(e){}return;}
    if(me.pub&&myPubJwk&&me.pub.x!==myPubJwk.x){
      try{localStorage.removeItem('kr.room');}catch(e){}
      uiNote='Dein Platz in Raum '+c+' wurde auf einem anderen Gerät übernommen. Du kannst zuschauen oder neu beitreten.';render();return;
    }
    applyConfig(r.config);myName=me.name||myName;enter(c);
  }).catch(function(e){if(e&&/nicht gefunden/.test(e.message)){try{localStorage.removeItem('kr.room');}catch(x){}}});
}
render();
/* Service Worker: hält die App auf dem Gerät vor (Übungsraum offline, z. B. im Flugzeug) */
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
if(window.addEventListener){
  window.addEventListener('online',function(){netDown=false;fetchRooms();render();});
  window.addEventListener('offline',function(){netDown=true;render();});   // sofort anzeigen, nicht erst nach dem Neuladen
}
(function(){
  try{
    if(!window.crypto||!crypto.subtle){
      fatal='Dieser Browser bietet keine Web-Crypto. Die Seite muss über https:// (oder localhost) laufen.';
      render();return;
    }
    var u=null;try{u=localStorage.getItem('kr.uid');}catch(e){}
    if(!u){u='u'+hx(rnd(8));try{localStorage.setItem('kr.uid',u);}catch(e){}}
    uid=u;db=1;
    api('config',{}).then(function(r){applyConfig(r.config);render();}).catch(function(){});
    fetchRooms();fetchInviteInfo();
    loadKeys().then(function(){
      try{myName=localStorage.getItem('kr.name')||'';}catch(e){}
      render();
      if(/[?&]sp=1\b/.test(location.search||'')&&!code){spStart();}   // Kurzbefehl „Übungsraum“ (auch offline)
      else rejoin();
      if(inviteCode&&myName){var ci=$('code');if(ci)ci.value=inviteCode;}
    }).catch(function(e){fatal=(e&&e.message)||String(e);render();});
  }catch(e){fatal=(e&&e.message)||String(e);render();}
})();
})();
</script>
