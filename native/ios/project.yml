# XcodeGen spec. Projekt erzeugen:  cd native/ios && Scripts/fetch-nodejs-mobile.sh && xcodegen
name: LetzteRunde
options:
  developmentLanguage: de
  bundleIdPrefix: de.sgitaize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  LetzteRunde:
    type: application
    platform: iOS
    sources:
      - LetzteRunde
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
        codeSign: true
      - sdk: StoreKit.framework
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KR_BUNDLE_ID)
        PRODUCT_NAME: LetzteRunde
        CODE_SIGN_ENTITLEMENTS: LetzteRunde/LetzteRunde.entitlements
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: LetzteRunde/Node/LetzteRunde-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: LetzteRunde/Info.plist
      properties:
        CFBundleDisplayName: Letzte Runde
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.card-games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Letzte Runde findet Spiele im WLAN und kann selbst ein Spiel im WLAN hosten – ganz ohne Internet."
        NSBonjourServices: [_letzterunde._tcp]
        NSCameraUsageDescription: "Zum Scannen des QR-Codes eines Spiels im WLAN."
        NSMicrophoneUsageDescription: "Für den optionalen Voice-Chat mit deinen Mitspieler*innen."
    preBuildScripts:
      - name: Spiel und Server bündeln (app/ → game/)
        script: "\"${SRCROOT}/Scripts/bundle-game.sh\""
        basedOnDependencyAnalysis: false
schemes:
  LetzteRunde:
    build:
      targets:
        LetzteRunde: all
    run:
      config: Debug
      storeKitConfiguration: LetzteRunde/Store/LetzteRunde.storekit   # Trinkgeld im Simulator/Xcode testen
    archive:
      config: Release
