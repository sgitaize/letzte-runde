server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __NAMES__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lrssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn lr___PORT___conn 40;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy same-origin always;

    # Kurzadresse wie bisher auf Plesk: /admin = admin.html
    location = /admin { rewrite ^ /admin.html last; }

    location / {
        limit_req zone=lr___PORT___req burst=60 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nur die echte Adresse weitergeben (überschreiben statt anhängen) – der Server vertraut dem letzten öffentlichen Eintrag
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lr___PORT___connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
