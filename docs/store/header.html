<!doctype html>
<!-- App-Store-Kopfzeile (Produktseite). Rendern: siehe README.md („Kopfzeile“). Wichtiges bleibt mittig, Apple beschneidet je nach Gerät. -->
<html lang="de"><head><meta charset="utf-8"><title>Letzte Runde – Kopfzeile</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse 70% 90% at 50% 45%,#2a7553 0%,#1f5a41 45%,#123a2a 100%);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#eef5f0;
    display:flex;align-items:center;justify-content:center;position:relative}
  /* feine Filzstruktur */
  body:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.018) 0 2px,transparent 2px 5px);pointer-events:none}
  .stage{position:relative;display:flex;align-items:center;gap:6vh;transform:translateX(-1vh)}
  .hand{position:relative;width:42vh;height:44vh}
  .card{position:absolute;width:21vh;height:29vh;border-radius:2.4vh;background:#fbf9f4;border:.25vh solid #d9d3c4;
    box-shadow:0 2.2vh 4.5vh rgba(0,0,0,.38),0 .3vh .6vh rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:650;line-height:1}
  .card .r{font-size:9.5vh}.card .s{font-size:8.5vh;margin-top:.6vh}
  .red{color:#c0392b}.blk{color:#1b1b19}
  .c1{left:0;top:6vh;transform:rotate(-14deg)}
  .c2{left:11vh;top:2vh;transform:rotate(-3deg)}
  .c3{left:22vh;top:5vh;transform:rotate(10deg)}
  .text{max-width:62vh}
  h1{font-family:Georgia,"Iowan Old Style",serif;font-style:italic;font-weight:700;font-size:13vh;line-height:.98;margin:0 0 2.4vh;letter-spacing:-.01em;
    text-shadow:0 .6vh 2.4vh rgba(0,0,0,.3)}
  p{font-size:3.9vh;line-height:1.3;margin:0 0 3.6vh;color:rgba(238,245,240,.9)}
  .chips{display:flex;gap:2.2vh}
  .chip{width:9vh;height:9vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:4.2vh;
    border:.7vh dashed var(--cb);background:var(--cf);color:var(--ct);box-shadow:0 0 0 .5vh var(--cf),0 1.2vh 2.4vh rgba(0,0,0,.35)}
  .r1{--cf:#f4f1ea;--ct:#1b1b19;--cb:rgba(0,0,0,.28)}
  .r2{--cf:#e9c43f;--ct:#1b1407;--cb:rgba(0,0,0,.25)}
  .r3{--cf:#e07b28;--ct:#fff;--cb:rgba(255,255,255,.6)}
  .r4{--cf:#c0392b;--ct:#fff;--cb:rgba(255,255,255,.6)}
  .chip.mine{box-shadow:0 0 0 .5vh var(--cf),0 0 0 1.3vh #e0b453,0 1.2vh 2.4vh rgba(0,0,0,.35)}
</style></head>
<body>
  <div class="stage">
    <div class="hand">
      <div class="card c1"><span class="r red">D</span><span class="s red">♦</span></div>
      <div class="card c2"><span class="r blk">D</span><span class="s blk">♣</span></div>
      <div class="card c3"><span class="r red">3</span><span class="s red">♥</span></div>
    </div>
    <div class="text">
      <h1>Letzte Runde</h1>
      <p>Pokern im Team – ordnet eure Hände, ohne darüber zu reden.</p>
      <div class="chips"><div class="chip r1">1</div><div class="chip r2">2</div><div class="chip r3">3</div><div class="chip r4 mine">4</div></div>
    </div>
  </div>
</body></html>
